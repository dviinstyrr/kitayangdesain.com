<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>404 — Kita Yang Desain</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Outfit:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#F7F5F2;--fg:#1A1714;--accent:#C8A96E;--fg2:#5C5651;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;}
    .num{font-family:'Cormorant Garamond',serif;font-size:clamp(6rem,20vw,14rem);font-weight:300;color:var(--accent);opacity:0.3;line-height:1;display:block;}
    h1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,4vw,3rem);font-weight:300;margin-bottom:1rem;}
    p{color:var(--fg2);font-size:1rem;margin-bottom:2.5rem;}
    a{display:inline-block;padding:0.85rem 2.5rem;background:var(--fg);color:white;font-size:0.8rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;transition:background .3s;}
    a:hover{background:var(--accent);}
  </style>
</head>
<body>
  <div>
    <span class="num">404</span>
    <h1>Halaman tidak ditemukan</h1>
    <p>Sepertinya halaman yang Anda cari<br>sedang dalam proses desain ulang.</p>
    <a href="/">← Kembali ke Beranda</a>
  </div>
</body>
</html>
