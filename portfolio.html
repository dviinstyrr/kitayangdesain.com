<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portofolio — Kitayangdesain</title>
  <meta name="description" content="Kumpulan karya terpilih Kitayangdesain: branding, UI/UX, packaging, web, dan spatial design." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/portfolio-page.css" />
</head>
<body class="pf-page">
  <!-- LOADER -->
<div id="loader"><span class="loader-text">KYD.</span></div>
  <!-- CURSOR -->
  <div class="cursor"      id="cursor"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- ============================
       HEADER
  ============================ -->
  <header class="pf-header">
    <div class="pf-header-inner">
      <div>
        <a href="index.html" class="pf-back-link">← Kembali ke Beranda</a>
        <div class="pf-header-label">kitayangdesain.com</div>
        <h1>Karya<br><em>kami.</em></h1>
      </div>
      <div class="pf-header-meta">
        <span class="pf-header-count" id="pf-count">0</span>
        <span class="pf-header-count-label">karya<br>ditampilkan</span>
      </div>
    </div>
  </header>

  <!-- ============================
       FILTER BAR (sticky)
  ============================ -->
  <div class="pf-filter-bar">
    <div class="pf-filter-inner">
      <div class="pf-filter-tabs" id="pf-filter-tabs"></div>
      <div class="pf-view-toggle">
        <button class="pf-view-btn active" id="btn-view-grid" title="Grid view">
          ⊞
        </button>
        <button class="pf-view-btn" id="btn-view-list" title="List view">
          ☰
        </button>
      </div>
    </div>
  </div>

  <!-- ============================
       MAIN CONTENT
  ============================ -->
  <main class="pf-main">

    <!-- Featured Section -->
    <section class="pf-featured-section" style="margin-bottom:3rem">
      <div class="pf-featured-label">Karya Pilihan</div>
      <div class="pf-featured-grid" id="pf-featured-grid"></div>
    </section>

    <!-- All Works -->
    <div class="pf-featured-label" style="margin-bottom:1.5rem">
      Semua Karya
      <span id="pf-total" style="font-weight:400;color:var(--fg3)"></span>
    </div>
    <div class="pf-grid" id="pf-grid"></div>

  </main>

  <!-- ============================
       DETAIL MODAL
  ============================ -->
  <div class="pf-modal-overlay" id="pf-modal-overlay">
    <div class="pf-modal" id="pf-modal">
      <button class="pf-modal-close" id="pf-modal-close">✕</button>

      <!-- Left: image -->
      <div class="pf-modal-img" id="pf-modal-img"></div>

      <!-- Right: info -->
      <div class="pf-modal-body">
        <div class="pf-modal-tags" id="pf-modal-tags"></div>

        <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:0.4rem">
          <span class="label" style="margin:0" id="pf-modal-cat"></span>
          <span style="color:var(--fg3);font-size:0.75rem">·</span>
          <span style="font-size:0.75rem;color:var(--fg3)" id="pf-modal-year"></span>
        </div>

        <h2 class="pf-modal-title" id="pf-modal-title"></h2>
        <p class="pf-modal-client" id="pf-modal-client"></p>

        <p class="pf-modal-section-title">Tentang Proyek</p>
        <p class="pf-modal-text" id="pf-modal-desc"></p>

        <p class="pf-modal-section-title">Hasil</p>
        <div class="pf-modal-result" id="pf-modal-result"></div>

        <!-- Navigation between items -->
        <div class="pf-modal-nav">
          <button class="pf-modal-nav-btn" id="pf-modal-prev">← Sebelumnya</button>
          <button class="pf-modal-nav-btn" id="pf-modal-next">Berikutnya →</button>
        </div>

        <!-- CTA -->
        <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);text-align:center">
          <p style="font-size:0.82rem;color:var(--fg3);margin-bottom:1rem">Tertarik berkolaborasi?</p>
          <a href="collab.html" class="btn btn-accent" style="width:100%;justify-content:center">Mulai Proyek Serupa →</a>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="pf-toast" id="pf-toast"></div>

  <!-- ============================
       FOOTER MINI
  ============================ -->
  <footer style="background:var(--fg);padding:2rem clamp(1.5rem,5vw,4rem);text-align:center">
    <a href="index.html" style="font-family:var(--serif);font-size:1.2rem;color:var(--white);letter-spacing:0.04em">
      Kitayang<span style="color:var(--accent)">desain</span>
    </a>
    <p style="font-size:0.78rem;color:rgba(255,255,255,0.3);margin-top:0.75rem">
      © 2026 kitayangdesain.com · <a href="admin-local/admin.html" style="color:rgba(255,255,255,0.2);transition:color .2s" onmouseover="this.style.color='#C8A96E'" onmouseout="this.style.color='rgba(255,255,255,0.2)'">Admin</a>
    </p>
  </footer>

  <!-- JS -->
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/portfolio-page.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
